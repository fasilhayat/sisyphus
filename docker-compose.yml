# ── Oasis Resilience — Observability Stack ────────────────────────────────────
#
# Usage:
#   docker compose up -d
#   dotnet run --project Demo        (starts app + /metrics on :9464)
#   open http://localhost:3000       (Grafana — admin / admin)
#
# The Demo app exposes http://localhost:9464/metrics via prometheus-net.
# To enable full PromQL queries and dashboard data, add a Prometheus container
# that scrapes host.docker.internal:9464 and point the Grafana datasource at it.

services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: oasis-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
