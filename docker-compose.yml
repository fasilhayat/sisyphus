# ── Oasis Resilience — Observability Stack ────────────────────────────────────
#
# Usage:
#   docker compose up -d
#   dotnet run --project Demo        (starts app + /metrics on :9464)
#   open http://localhost:3000       (Grafana — admin / admin)
#
# Prometheus scrapes the Demo app at http://host.docker.internal:9464/metrics
# Grafana is pre-provisioned with the Prometheus datasource and a dashboard.

services:
  prometheus:
    image: docker.nykreditnet.net/prom/prometheus:v2.52.0
    container_name: oasis-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: docker.nykreditnet.net/grafana/grafana:11.0.0
    container_name: oasis-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
