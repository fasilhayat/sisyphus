<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oasis.Resilience — AOP + Akka.NET Explainer</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ───────────────────────────────────────────────────── */
  header {
    padding: 20px 32px 14px;
    border-bottom: 1px solid #21262d;
    background: #161b22;
  }
  header h1 { font-size: 1.35rem; color: #e6edf3; font-weight: 600; }
  header p  { font-size: 0.82rem; color: #8b949e; margin-top: 4px; }

  /* ── Tabs ─────────────────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 0;
    background: #161b22;
    border-bottom: 1px solid #21262d;
    padding: 0 32px;
  }
  .tab-btn {
    padding: 10px 22px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #8b949e;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 500;
    transition: color .2s, border-color .2s;
  }
  .tab-btn:hover  { color: #c9d1d9; }
  .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }

  /* ── Main layout ──────────────────────────────────────────────── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Code panel ───────────────────────────────────────────────── */
  .code-panel {
    width: 480px;
    min-width: 420px;
    background: #161b22;
    border-right: 1px solid #21262d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .code-panel-title {
    padding: 10px 14px;
    font-size: 0.75rem;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: .06em;
    border-bottom: 1px solid #21262d;
    background: #0d1117;
  }
  pre.code-block {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.65;
    color: #c9d1d9;
    white-space: pre;
  }
  /* Syntax colours */
  .kw   { color: #ff7b72; }
  .attr { color: #79c0ff; }
  .cls  { color: #ffa657; }
  .str  { color: #a5d6ff; }
  .cmt  { color: #8b949e; font-style: italic; }
  .num  { color: #79c0ff; }
  .mth  { color: #d2a8ff; }

  /* Highlight effect */
  .hl {
    background: #1f3244;
    border-left: 2px solid #58a6ff;
    border-radius: 2px;
    padding-left: 4px;
    margin-left: -6px;
    display: block;
    transition: background .3s;
  }

  /* ── Stage ────────────────────────────────────────────────────── */
  .stage-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  svg#diagram {
    width: 100%;
    height: 100%;
  }

  /* ── Node states ──────────────────────────────────────────────── */
  /* .node-inner is the inner <g> that holds visuals + receives state classes.
     The outer <g> only carries transform="translate(x,y)" for positioning,
     keeping CSS animations isolated so shake doesn't fight SVG transform. */
  .node-inner rect, .node-inner circle {
    transition: filter .3s, opacity .3s, stroke .3s;
  }
  .node-inner text { pointer-events: none; transition: opacity .3s; }

  .node-inner.state-active  rect,
  .node-inner.state-active  circle { filter: drop-shadow(0 0 8px #58a6ff); stroke: #58a6ff !important; }
  .node-inner.state-success rect,
  .node-inner.state-success circle { filter: drop-shadow(0 0 8px #3fb950); stroke: #3fb950 !important; }
  .node-inner.state-error   rect,
  .node-inner.state-error   circle { filter: drop-shadow(0 0 8px #f85149); stroke: #f85149 !important; }
  .node-inner.state-warn    rect,
  .node-inner.state-warn    circle { filter: drop-shadow(0 0 8px #d29922); stroke: #d29922 !important; }
  .node-inner.state-dim     rect,
  .node-inner.state-dim     circle { opacity: .35; }
  .node-inner.state-dim     text   { opacity: .35; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-5px); }
    40%      { transform: translateX( 5px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX( 4px); }
  }
  /* shake is on the inner group — no conflict with the outer SVG translate */
  .node-inner.state-error {
    animation: shake .45s ease;
    transform-box: fill-box;
    transform-origin: center;
  }

  /* File-section divider inside the code block */
  .file-sep {
    display: block;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    font-style: normal;
    letter-spacing: 0.05em;
    color: #79c0ff;
    background: #0d1117;
    border-top: 1px solid #21262d;
    border-bottom: 1px solid #21262d;
    margin: 10px -16px 6px -16px;
    padding: 5px 16px;
    white-space: nowrap;
  }
  .file-sep:first-child { margin-top: -14px; border-top: none; }


    0%   { r: 22px; opacity: .8; }
    100% { r: 36px; opacity: 0;  }
  }

  /* ── Packet dots ──────────────────────────────────────────────── */
  .packet {
    r: 6px;
    filter: drop-shadow(0 0 4px currentColor);
  }

  /* ── Description bar ──────────────────────────────────────────── */
  .description-bar {
    background: #161b22;
    border-top: 1px solid #21262d;
    padding: 12px 24px;
    font-size: 0.86rem;
    color: #e6edf3;
    min-height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-badge {
    background: #21262d;
    color: #8b949e;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 0.75rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Controls ─────────────────────────────────────────────────── */
  .controls {
    background: #0d1117;
    border-top: 1px solid #21262d;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    padding: 7px 18px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #30363d; border-color: #58a6ff; color: #e6edf3; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.primary:hover { background: #388bfd; }
  .btn:disabled { opacity: .4; cursor: default; }

  .progress-track {
    flex: 1;
    height: 4px;
    background: #21262d;
    border-radius: 2px;
    overflow: visible;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #58a6ff;
    border-radius: 2px;
    transition: width .4s ease;
  }
  .step-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #21262d;
    border: 1px solid #30363d;
    cursor: pointer;
    transition: background .2s;
  }
  .step-dot.done    { background: #58a6ff; border-color: #58a6ff; }
  .step-dot.current { background: #e6edf3; border-color: #e6edf3; }

  /* circuit breaker badge */
  .cb-badge {
    position: absolute;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  .cb-closed   { background: #1a4429; color: #3fb950; border: 1px solid #238636; }
  .cb-open     { background: #4a1515; color: #f85149; border: 1px solid #6e1a1a; }
  .cb-halfopen { background: #3d2f00; color: #d29922; border: 1px solid #9e6a03; }
</style>
</head>
<body>

<header>
  <h1>Oasis.Resilience — AOP + Akka.NET</h1>
  <p>Add a single attribute. The proxy intercepts the call and routes it through a dedicated Akka.NET actor that applies the pattern.</p>
</header>

<div class="tabs" id="tabBar">
  <button class="tab-btn active" data-tab="retry">🔁 Retry</button>
  <button class="tab-btn" data-tab="cb">⚡ Circuit Breaker</button>
  <button class="tab-btn" data-tab="supervision">🛡 Supervision</button>
  <button class="tab-btn" data-tab="fanout">🌊 Fan-Out</button>
</div>

<div class="main">
  <!-- Code panel -->
  <div class="code-panel">
    <div class="code-panel-title">C# — Implementation Class</div>
    <pre class="code-block" id="codeBlock"></pre>
  </div>

  <!-- Stage -->
  <div class="stage-wrap">
    <div class="stage">
      <svg id="diagram" viewBox="0 0 760 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="description-bar">
      <span class="step-badge" id="stepBadge">Step 1 / 1</span>
      <span id="descText"></span>
    </div>

    <div class="controls">
      <button class="btn" id="btnPrev">◀ Prev</button>
      <button class="btn primary" id="btnPlay">▶ Play</button>
      <button class="btn" id="btnNext">Next ▶</button>
      <div class="step-dots" id="stepDots"></div>
      <div style="flex:1"></div>
      <button class="btn" id="btnRestart">↺ Restart</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA — one object per tab
   ═══════════════════════════════════════════════════════════════════ */

/* ── helpers ── */
const kw  = s => `<tspan class="kw">${s}</tspan>`;
const at  = s => `<tspan class="attr">${s}</tspan>`;
const cl  = s => `<tspan class="cls">${s}</tspan>`;
const st  = s => `<tspan class="str">${s}</tspan>`;
const cm  = s => `<tspan class="cmt">${s}</tspan>`;
const nm  = s => `<tspan class="num">${s}</tspan>`;
const mt  = s => `<tspan class="mth">${s}</tspan>`;

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  RETRY tab                                                       ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const RETRY_CODE = `<span class="file-sep">📄 Program.cs</span><span id="rp0">services.${mt('AddResilient')}&lt;${cl('IBondService')},</span>
<span id="rp1">                 ${cl('BondService')}&gt;();</span>
<span class="file-sep">📄 BondService.cs</span><span id="rs0">${kw('public class')} ${cl('BondService')} : ${cl('IBondService')}</span>
<span id="rs1">{</span>
<span id="rs2">  ${at('[Retry')}(maxAttempts: ${nm('3')},</span>
<span id="rs3">         initialDelayMs: ${nm('500')}${at(']')}</span>
<span id="rs4">  ${kw('public async')} ${cl('Task')}&lt;${cl('BondData')}&gt;</span>
<span id="rs5">    ${mt('GetBondsAsync')}()</span>
<span id="rs6">  {</span>
<span id="rs7">    ${kw('var')} r = ${kw('await')} _http.${mt('GetAsync')}(url);</span>
<span id="rs8">    ${kw('return await')} r.${mt('ReadAsync')}&lt;${cl('BondData')}&gt;();</span>
<span id="rs9">  }</span>
<span id="rsa">}</span>
`;

const RETRY = {
  code: RETRY_CODE,
  nodes: [
    { id:'caller',   x:80,  y:190, label:'Caller',        sub:'Your code' },
    { id:'proxy',    x:240, y:190, label:'DispatchProxy',  sub:'[Retry] intercepted' },
    { id:'actor',    x:440, y:190, label:'RetryActor',     sub:'Akka.NET' },
    { id:'http',     x:630, y:190, label:'HTTP Service',   sub:'localhost:5080' },
  ],
  edges: [
    { id:'e1', from:'caller', to:'proxy' },
    { id:'e2', from:'proxy',  to:'actor' },
    { id:'e3', from:'actor',  to:'http'  },
    { id:'e4', from:'http',   to:'actor', dashed:true },
    { id:'e5', from:'actor',  to:'proxy', dashed:true },
    { id:'e6', from:'proxy',  to:'caller',dashed:true },
  ],
  steps: [
    {
      nodes:   { caller:'active', proxy:'default', actor:'default', http:'default' },
      packets: [],
      code:    ['rs2','rs3'],
      desc:    'You add <strong>[Retry]</strong> directly above the method in your implementation class — no interface change needed.'
    },
    {
      nodes:   { caller:'active', proxy:'default', actor:'default', http:'default' },
      packets: [],
      code:    ['rp0','rp1'],
      desc:    '<strong>AddResilient&lt;IBondService, BondService&gt;()</strong> in Program.cs wraps the class in a <em>DispatchProxy</em> at startup.'
    },
    {
      nodes:   { caller:'active', proxy:'default', actor:'default', http:'default' },
      packets: [ { edge:'e1', color:'#58a6ff', delay:0 } ],
      code:    ['rs4','rs5'],
      desc:    'Your code calls <strong>GetBondsAsync()</strong> — the call hits the proxy, not your class directly.'
    },
    {
      nodes:   { caller:'default', proxy:'active', actor:'default', http:'default' },
      packets: [],
      code:    ['rs2','rs3'],
      desc:    'The proxy reads the <strong>[Retry]</strong> attribute via reflection and resolves a <em>RetryActor</em> in Akka.NET.'
    },
    {
      nodes:   { caller:'default', proxy:'active', actor:'active', http:'default' },
      packets: [ { edge:'e2', color:'#58a6ff', delay:0 } ],
      code:    ['rs2','rs3'],
      desc:    'The proxy sends an <strong>OperationMessage</strong> to the RetryActor using <em>actor.Ask()</em>.'
    },
    {
      nodes:   { caller:'default', proxy:'default', actor:'active', http:'error' },
      packets: [ { edge:'e3', color:'#f85149', delay:0 }, { edge:'e4', color:'#f85149', delay:400 } ],
      code:    ['rs7','rs8'],
      desc:    '⚠️ Attempt 1 — HTTP 500. The actor catches the exception and schedules a retry after 500 ms.'
    },
    {
      nodes:   { caller:'default', proxy:'default', actor:'active', http:'error' },
      packets: [ { edge:'e3', color:'#f85149', delay:0 }, { edge:'e4', color:'#f85149', delay:400 } ],
      code:    ['rs7','rs8'],
      desc:    '⚠️ Attempt 2 — still failing. The actor waits <em>initialDelayMs × attempt</em> before each retry (with optional jitter).'
    },
    {
      nodes:   { caller:'default', proxy:'default', actor:'active', http:'success' },
      packets: [ { edge:'e3', color:'#3fb950', delay:0 }, { edge:'e4', color:'#3fb950', delay:400 } ],
      code:    ['rs7','rs8'],
      desc:    '✅ Attempt 3 — success! The actor sends the result back to the proxy.'
    },
    {
      nodes:   { caller:'success', proxy:'success', actor:'success', http:'success' },
      packets: [ { edge:'e5', color:'#3fb950', delay:0 }, { edge:'e6', color:'#3fb950', delay:400 } ],
      code:    ['rs4','rs5'],
      desc:    'The proxy returns the result to your <strong>await</strong> call. You never wrote a single retry loop.'
    },
  ]
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  CIRCUIT BREAKER tab                                             ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const CB_CODE = `<span class="file-sep">📄 Program.cs</span><span id="cp0">services.${mt('AddResilient')}&lt;${cl('IInventoryService')},</span>
<span id="cp1">                 ${cl('InventoryService')}&gt;();</span>
<span class="file-sep">📄 InventoryService.cs</span><span id="cs0">${kw('public class')} ${cl('InventoryService')}</span>
<span id="cs1">  : ${cl('IInventoryService')}</span>
<span id="cs2">{</span>
<span id="cs3">  ${at('[CircuitBreaker')}(</span>
<span id="cs4">    failureThreshold: ${nm('3')},</span>
<span id="cs5">    resetTimeoutMs:   ${nm('5000')}${at(']')}</span>
<span id="cs6">  ${at('[Retry')}(maxAttempts: ${nm('2')}${at(']')}</span>
<span id="cs7">  ${kw('public async')} ${cl('Task')}&lt;${cl('Stock')}&gt;</span>
<span id="cs8">    ${mt('GetStockAsync')}()</span>
<span id="cs9">  {</span>
<span id="csa">    ${kw('return await')} _http</span>
<span id="csb">      .${mt('GetAsync')}&lt;${cl('Stock')}&gt;(url);</span>
<span id="csc">  }</span>
<span id="csd">}</span>
`;

const CB = {
  code: CB_CODE,
  cbBadge: true,
  nodes: [
    { id:'caller',  x:80,  y:190, label:'Caller',       sub:'Your code' },
    { id:'proxy',   x:240, y:190, label:'DispatchProxy', sub:'[CB]+[Retry]' },
    { id:'cbactor', x:440, y:190, label:'CB Actor',      sub:'Akka.NET' },
    { id:'http',    x:630, y:190, label:'HTTP Service',  sub:'upstream' },
  ],
  edges: [
    { id:'e1', from:'caller',  to:'proxy'   },
    { id:'e2', from:'proxy',   to:'cbactor' },
    { id:'e3', from:'cbactor', to:'http'    },
    { id:'e4', from:'http',    to:'cbactor', dashed:true },
    { id:'e5', from:'cbactor', to:'proxy',   dashed:true },
    { id:'e6', from:'proxy',   to:'caller',  dashed:true },
    { id:'e7', from:'cbactor', to:'caller',  dashed:true, curved:true },
  ],
  steps: [
    {
      nodes:   { caller:'default', proxy:'default', cbactor:'default', http:'default' },
      packets: [],
      cbState: 'CLOSED',
      code:    ['cs3','cs4','cs5','cs6'],
      desc:    'Circuit starts <strong>CLOSED</strong>. Requests flow through. [CircuitBreaker] + [Retry] are stacked on the same method.'
    },
    {
      nodes:   { caller:'active', proxy:'active', cbactor:'active', http:'error' },
      packets: [ {edge:'e1',color:'#58a6ff',delay:0},{edge:'e2',color:'#58a6ff',delay:200},{edge:'e3',color:'#f85149',delay:400},{edge:'e4',color:'#f85149',delay:700} ],
      cbState: 'CLOSED',
      code:    ['csa','csb'],
      desc:    'Call 1 — failure. The CB actor records the failure. State stays <strong>CLOSED</strong> (threshold not reached).'
    },
    {
      nodes:   { caller:'active', proxy:'active', cbactor:'warn', http:'error' },
      packets: [ {edge:'e1',color:'#58a6ff',delay:0},{edge:'e2',color:'#58a6ff',delay:200},{edge:'e3',color:'#f85149',delay:400},{edge:'e4',color:'#f85149',delay:700} ],
      cbState: 'CLOSED',
      code:    ['csa','csb'],
      desc:    'Call 2 — failure. Failure count: 2. One more will open the circuit.'
    },
    {
      nodes:   { caller:'active', proxy:'active', cbactor:'error', http:'error' },
      packets: [ {edge:'e1',color:'#58a6ff',delay:0},{edge:'e2',color:'#58a6ff',delay:200},{edge:'e3',color:'#f85149',delay:400},{edge:'e4',color:'#f85149',delay:700} ],
      cbState: 'OPEN',
      code:    ['cs3','cs4','cs5'],
      desc:    '🔴 Call 3 — failure threshold reached! Circuit <strong>OPENS</strong>. The upstream is clearly unhealthy.'
    },
    {
      nodes:   { caller:'active', proxy:'active', cbactor:'error', http:'dim' },
      packets: [ {edge:'e1',color:'#58a6ff',delay:0},{edge:'e2',color:'#58a6ff',delay:200},{edge:'e5',color:'#f85149',delay:400},{edge:'e6',color:'#f85149',delay:650} ],
      cbState: 'OPEN',
      code:    ['cs3','cs5'],
      desc:    '⚡ Fast-fail! The CB actor immediately throws <em>CircuitBreakerOpenException</em> — no call reaches the HTTP service.'
    },
    {
      nodes:   { caller:'default', proxy:'default', cbactor:'warn', http:'default' },
      packets: [],
      cbState: 'HALF-OPEN',
      code:    ['cs4','cs5'],
      desc:    '⏱ After <strong>5 000 ms</strong> the circuit enters <strong>HALF-OPEN</strong>. The next request is allowed through as a probe.'
    },
    {
      nodes:   { caller:'active', proxy:'active', cbactor:'warn', http:'success' },
      packets: [ {edge:'e1',color:'#58a6ff',delay:0},{edge:'e2',color:'#58a6ff',delay:200},{edge:'e3',color:'#d29922',delay:400},{edge:'e4',color:'#3fb950',delay:700} ],
      cbState: 'HALF-OPEN',
      code:    ['csa','csb'],
      desc:    'Probe call succeeds. The CB actor resets the failure counter.'
    },
    {
      nodes:   { caller:'success', proxy:'success', cbactor:'success', http:'success' },
      packets: [ {edge:'e5',color:'#3fb950',delay:0},{edge:'e6',color:'#3fb950',delay:300} ],
      cbState: 'CLOSED',
      code:    ['cs3','cs6','cp0','cp1'],
      desc:    '✅ Circuit <strong>CLOSED</strong> again. Normal traffic resumes. Your service never needed to know any of this happened.'
    },
  ]
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  SUPERVISION tab                                                 ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const SUP_CODE = `<span class="file-sep">📄 Program.cs</span><span id="sp0">services.${mt('AddResilient')}&lt;${cl('IPipelineService')},</span>
<span id="sp1">                 ${cl('PipelineService')}&gt;();</span>
<span class="file-sep">📄 PipelineService.cs</span><span id="ss0">${kw('public class')} ${cl('PipelineService')}</span>
<span id="ss1">  : ${cl('IPipelineService')}</span>
<span id="ss2">{</span>
<span id="ss3">  ${at('[Supervision')}(</span>
<span id="ss4">    ${cl('SupervisionStrategy')}.${mt('RestartWithBackoff')},</span>
<span id="ss5">    maxRetries: ${nm('4')}, backoffMinMs: ${nm('500')}${at(']')}</span>
<span id="ss6">  ${at('[Retry')}(maxAttempts: ${nm('3')}${at(']')}</span>
<span id="ss7">  ${kw('public async')} ${cl('Task')}</span>
<span id="ss8">    ${mt('RunPipelineAsync')}()</span>
<span id="ss9">  {</span>
<span id="ssa">    ${kw('await')} _http.${mt('PostAsync')}(url, data);</span>
<span id="ssb">  }</span>
<span id="ssc">}</span>
`;

const SUP = {
  code: SUP_CODE,
  nodes: [
    { id:'caller',     x:60,  y:190, label:'Caller',         sub:'Your code' },

/* ═══════════════════════════════════════════════════════════════════
   RENDERER
   ═══════════════════════════════════════════════════════════════════ */
const TABS = { retry: RETRY, cb: CB, supervision: SUP, fanout: FO };
let activeTab   = 'retry';
let currentStep = 0;
let playTimer   = null;
let animTimers  = [];

const svg        = document.getElementById('diagram');
const codeBlock  = document.getElementById('codeBlock');
const descText   = document.getElementById('descText');
const stepBadge  = document.getElementById('stepBadge');
const stepDots   = document.getElementById('stepDots');
const btnPrev    = document.getElementById('btnPrev');
const btnPlay    = document.getElementById('btnPlay');
const btnNext    = document.getElementById('btnNext');
const btnRestart = document.getElementById('btnRestart');

const NS = 'http://www.w3.org/2000/svg';
function mkEl(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

/* ── layout helpers ── */
const NODE_W = 110, NODE_H = 48;

function nodeCenter(n) {
  return { x: n.x, y: n.y };
}

function edgePoints(tab, edge) {
  const from = tab.nodes.find(n => n.id === edge.from);
  const to   = tab.nodes.find(n => n.id === edge.to  );
  const fc   = nodeCenter(from);
  const tc   = nodeCenter(to);
  return { x1: fc.x, y1: fc.y, x2: tc.x, y2: tc.y };
}

/* ── build static SVG ── */
function buildSVG(tab) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const vbW = 760, vbH = 380;
  svg.setAttribute('viewBox', `0 0 ${vbW} ${vbH}`);

  /* defs */
  const defs = mkEl('defs');
  const mkArrow = (id, color) => {
    const m = mkEl('marker', { id, markerWidth:'8', markerHeight:'6', refX:'8', refY:'3', orient:'auto' });
    const p = mkEl('path',   { d:'M0,0 L8,3 L0,6 Z', fill: color });
    m.appendChild(p); return m;
  };
  defs.appendChild(mkArrow('arr-fwd', '#555e6a'));
  defs.appendChild(mkArrow('arr-back','#3d4551'));
  svg.appendChild(defs);

  /* edges */
  const edgeGroup = mkEl('g', { id:'edges' });
  for (const edge of tab.edges) {
    const pts = edgePoints(tab, edge);
    let el;
    if (edge.curved) {
      const cx = (pts.x1 + pts.x2) / 2;
      const cy = Math.min(pts.y1, pts.y2) - 60;
      el = mkEl('path', {
        d: `M${pts.x1},${pts.y1} Q${cx},${cy} ${pts.x2},${pts.y2}`,
        fill:'none', stroke: edge.dashed ? '#3d4551' : '#555e6a',
        'stroke-width':'1.5',
        'stroke-dasharray': edge.dashed ? '5,4' : 'none',
        'marker-end': edge.dashed ? 'url(#arr-back)' : 'url(#arr-fwd)',
        id: 'edge-'+edge.id
      });
    } else {
      el = mkEl('line', {
        x1:pts.x1, y1:pts.y1, x2:pts.x2, y2:pts.y2,
        stroke: edge.dashed ? '#3d4551' : '#555e6a',
        'stroke-width':'1.5',
        'stroke-dasharray': edge.dashed ? '5,4' : 'none',
        'marker-end': edge.dashed ? 'url(#arr-back)' : 'url(#arr-fwd)',
        id: 'edge-'+edge.id
      });
    }
    edgeGroup.appendChild(el);
  }
  svg.appendChild(edgeGroup);

  /* nodes */
  const nodeGroup = mkEl('g', { id:'nodes' });
  for (const n of tab.nodes) {
    /* outer g: only positioning — never gets CSS state classes */
    const outer = mkEl('g', { id:'node-'+n.id, transform:`translate(${n.x},${n.y})` });
    /* inner g: receives state-* classes + shake animation */
    const g = mkEl('g', { class:'node-inner' });

    const rect = mkEl('rect', {
      x: -NODE_W/2, y: -NODE_H/2,
      width: NODE_W, height: NODE_H,
      rx:'8', ry:'8',
      fill:'#161b22', stroke:'#30363d', 'stroke-width':'1.5'
    });
    g.appendChild(rect);

    const label = mkEl('text', { x:'0', y:'-6', 'text-anchor':'middle', fill:'#e6edf3', 'font-size':'12', 'font-weight':'600' });
    label.textContent = n.label;
    g.appendChild(label);

    const sub = mkEl('text', { x:'0', y:'11', 'text-anchor':'middle', fill:'#8b949e', 'font-size':'10' });
    sub.textContent = n.sub;
    g.appendChild(sub);

    outer.appendChild(g);
    nodeGroup.appendChild(outer);
  }
  svg.appendChild(nodeGroup);

  /* cb badge placeholder */
  if (tab.cbBadge) {
    const fo = mkEl('foreignObject', { id:'cb-badge-fo', x:'370', y:'60', width:'130', height:'30' });
    const div = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    div.id = 'cb-badge';
    div.className = 'cb-badge cb-closed';
    div.textContent = '● CLOSED';
    fo.appendChild(div);
    svg.appendChild(fo);
  }

  /* packet layer */
  svg.appendChild(mkEl('g', { id:'packets' }));
}

/* ── apply step ── */
function applyStep(tab, stepIdx) {
  const step = tab.steps[stepIdx];
  if (!step) return;

  /* node states */
  for (const n of tab.nodes) {
    const outer = document.getElementById('node-'+n.id);
    if (!outer) continue;
    const inner = outer.firstElementChild; // the .node-inner g
    if (!inner) continue;
    const s = step.nodes[n.id] || 'default';
    // Force animation to replay by removing and re-adding the class
    inner.className.baseVal = 'node-inner';
    void inner.getBoundingClientRect(); // trigger reflow
    inner.className.baseVal = 'node-inner state-'+s;
  }

  /* cb badge */
  if (tab.cbBadge && step.cbState) {
    const badge = document.getElementById('cb-badge');
    if (badge) {
      badge.className = 'cb-badge cb-'+step.cbState.toLowerCase().replace('-','');
      const labels = { CLOSED:'● CLOSED', OPEN:'● OPEN', 'HALF-OPEN':'◑ HALF-OPEN' };
      badge.textContent = labels[step.cbState] || step.cbState;
    }
  }

  /* code highlight */
  const spans = codeBlock.querySelectorAll('span[id]');
  spans.forEach(s => s.classList.remove('hl'));
  (step.code || []).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('hl');
  });

  /* description */
  descText.innerHTML = step.desc;
  stepBadge.textContent = `Step ${stepIdx+1} / ${tab.steps.length}`;

  /* dots */
  document.querySelectorAll('.step-dot').forEach((dot, i) => {
    dot.className = 'step-dot' + (i < stepIdx ? ' done' : i === stepIdx ? ' current' : '');
  });

  /* buttons */
  btnPrev.disabled = stepIdx === 0;
  btnNext.disabled = stepIdx === tab.steps.length - 1;
  // Update Play button label based on position
  if (!playTimer) {
    const atEnd = stepIdx === tab.steps.length - 1;
    btnPlay.textContent = atEnd ? '↺ Play again' : '▶ Play';
  }

  /* packets */
  clearPackets();
  const packetLayer = document.getElementById('packets');
  (step.packets || []).forEach((p, pi) => {
    const edge = tab.edges.find(e => e.id === p.edge);
    if (!edge) return;
    const pts = edgePoints(tab, edge);
    const dot = mkEl('circle', { class:'packet', cx: pts.x1, cy: pts.y1, r:'6', fill: p.color });
    packetLayer.appendChild(dot);

    const t = setTimeout(() => {
      animatePacket(dot, pts.x1, pts.y1, pts.x2, pts.y2, 500, edge.curved
        ? (pts.x1+pts.x2)/2 : null,
        edge.curved ? Math.min(pts.y1,pts.y2)-60 : null
      );
    }, p.delay || 0);
    animTimers.push(t);
  });
}

function clearPackets() {
  animTimers.forEach(t => clearTimeout(t));
  animTimers = [];
  const layer = document.getElementById('packets');
  if (layer) while (layer.firstChild) layer.removeChild(layer.firstChild);
}

function animatePacket(el, x1, y1, x2, y2, dur, cxOpt, cyOpt) {
  const steps = 60;
  let frame = 0;
  const tid = setInterval(() => {
    const t = frame / steps;
    let x, y;
    if (cxOpt != null) {
      // quadratic bezier
      x = (1-t)*(1-t)*x1 + 2*(1-t)*t*cxOpt + t*t*x2;
      y = (1-t)*(1-t)*y1 + 2*(1-t)*t*cyOpt  + t*t*y2;
    } else {
      x = x1 + (x2-x1)*t;
      y = y1 + (y2-y1)*t;
    }
    el.setAttribute('cx', x);
    el.setAttribute('cy', y);
    el.setAttribute('opacity', t < 0.9 ? 1 : 1-((t-0.9)/0.1));
    frame++;
    if (frame > steps) {
      clearInterval(tid);
      if (el.parentNode) el.parentNode.removeChild(el);
    }
  }, dur / steps);
  animTimers.push(tid);
}

/* ── switch tab ── */
function switchTab(tabKey) {
  stopPlay();
  activeTab    = tabKey;
  currentStep  = 0;

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabKey));

  const tab = TABS[tabKey];
  codeBlock.innerHTML = tab.code;
  buildSVG(tab);

  /* build step dots */
  stepDots.innerHTML = '';
  tab.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === 0 ? ' current' : '');
    d.title = `Step ${i+1}`;
    d.addEventListener('click', () => { stopPlay(); currentStep = i; applyStep(tab, i); });
    stepDots.appendChild(d);
  });

  applyStep(tab, 0);
}

/* ── controls ── */
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  const tab = TABS[activeTab];
  const atEnd = currentStep === tab.steps.length - 1;
  btnPlay.textContent = atEnd ? '↺ Play again' : '▶ Play';
  btnPlay.classList.remove('primary');
}

btnPlay.addEventListener('click', () => {
  const tab = TABS[activeTab];
  if (playTimer) {
    stopPlay(); return;
  }
  // If at the last step, restart from the beginning
  if (currentStep >= tab.steps.length - 1) {
    currentStep = 0;
    applyStep(tab, 0);
  }
  btnPlay.textContent = '⏸ Pause';
  btnPlay.classList.add('primary');
  playTimer = setInterval(() => {
    if (currentStep < tab.steps.length - 1) {
      currentStep++;
      applyStep(tab, currentStep);
    } else {
      stopPlay();
    }
  }, 2800);
});

btnNext.addEventListener('click', () => {
  stopPlay();
  const tab = TABS[activeTab];
  if (currentStep < tab.steps.length - 1) { currentStep++; applyStep(tab, currentStep); }
});

btnPrev.addEventListener('click', () => {
  stopPlay();
  if (currentStep > 0) { currentStep--; applyStep(TABS[activeTab], currentStep); }
});

btnRestart.addEventListener('click', () => {
  stopPlay();
  currentStep = 0;
  applyStep(TABS[activeTab], 0);
});

document.getElementById('tabBar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

/* ── init ── */
switchTab('retry');
</script>
